<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Aura Camila Pico Araque — Desarrolladora de software">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; }
    .line { stroke: #e5e7eb; stroke-width: 1; fill: none; }
    .prompt { fill: #3b5bdb; font-size: 15px; }
    .mute { fill: #6b7280; font-size: 15px; }
    .name { fill: #0b0f1a; font-size: 40px; font-weight: 600; letter-spacing: -1px; }
    .role { fill: #6b7280; font-size: 17px; }
    .cursor, .dot { fill: #3b5bdb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .line { stroke: #30363d; }
      .prompt, .cursor, .dot { fill: #7c9cff; }
      .mute, .role { fill: #8b949e; }
      .name { fill: #e6edf3; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .l1 { animation: in .6s ease .2s both; }
    .l2 { animation: in .7s ease .8s both; }
    .l3 { animation: in .7s ease 1.4s both; }
    .l4 { animation: in .7s ease 2.0s both; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect class="bg" width="900" height="240" rx="14"/>
  <rect x=".5" y=".5" width="899" height="239" rx="14" class="line"/>

  <!-- barra superior -->
  <line class="line" x1="0" y1="64" x2="900" y2="64"/>
  <circle cx="34" cy="32" r="5" fill="none" class="line" stroke-width="1.5"/>
  <circle cx="54" cy="32" r="5" fill="none" class="line" stroke-width="1.5"/>
  <circle cx="74" cy="32" r="5" fill="none" class="line" stroke-width="1.5"/>
  <text x="450" y="37" text-anchor="middle" class="mute" style="font-size:13px">~/aura</text>
  <circle class="dot" cx="806" cy="32" r="4"/>
  <text x="820" y="37" class="mute" style="font-size:13px">disponible</text>

  <!-- contenido -->
  <g class="l1"><text x="48" y="110" class="prompt">$ <tspan class="mute">Determinada</tspan></text></g>
  <g class="l2"><text x="48" y="156" class="name">Aura Camila Pico Araque</text></g>
  <g class="l3"><text x="48" y="188" class="role">Desarrolladora de software · web &amp; bases de datos</text></g>
  <g class="l4">
    <text x="48" y="218" class="prompt">$ <tspan class="mute">Produciendo --Persistiendo </tspan></text>
    <rect class="cursor" x="318" y="205" width="10" height="17"/>
  </g>
</svg>
